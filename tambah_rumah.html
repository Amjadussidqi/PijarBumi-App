<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Rumah - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> ::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-gray-100 h-screen flex justify-center">

    <div class="w-full max-w-md h-full relative flex flex-col bg-gray-50 overflow-hidden shadow-2xl">
        
        <header class="bg-gradient-to-br from-[#1cd988] to-[#119468] pt-12 pb-12 px-4 flex items-center rounded-b-[40px] text-white">
            <a href="dashboard.html" class="text-white text-xl pl-2"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="flex-1 text-center text-lg font-bold pr-6">Tambah Rumah</h1>
        </header>

        <main class="flex-1 overflow-y-auto px-5 -mt-6 pb-12">
            <form id="formRumah" class="space-y-6">
                
                <div class="space-y-4">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Basics</p>
                    
                    <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Nama Rumah</label>
                        <div class="flex items-center mt-3">
                            <i class="fa-solid fa-house text-gray-500 ml-1 mr-3 text-lg"></i>
                            <input type="text" id="namaRumah" placeholder="Contoh: Rumah Utama" required class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none">
                        </div>
                    </div>

                    <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Alamat / Kota</label>
                        <div class="flex items-center mt-3">
                            <i class="fa-solid fa-location-dot text-gray-500 ml-1 mr-3 text-lg"></i>
                            <input type="text" id="alamatRumah" placeholder="Contoh: Bandung" required class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none">
                        </div>
                    </div>

                    <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Jenis Rumah</label>
                        <select id="jenisRumah" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-2 appearance-none">
                            <option>SINGLE FAMILY</option>
                            <option>TOWNHOUSE</option>
                            <option>APARTEMEN</option>
                        </select>
                        <i class="fa-solid fa-caret-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-4">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Details</p>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Luas (m²)</label>
                            <input type="number" id="luasRumah" placeholder="100" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-3">
                        </div>
                        <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Tahun Dibangun</label>
                            <input type="number" id="tahunRumah" placeholder="2020" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-3">
                        </div>
                        <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Kamar Tidur</label>
                            <input type="number" id="kamarTidur" placeholder="3" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-3">
                        </div>
                        <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Kamar Mandi</label>
                            <input type="number" id="kamarMandi" placeholder="2" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-3">
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Energy & Tarif PLN</p>
                    
                    <div class="relative bg-white border border-gray-200 rounded-2xl p-3 shadow-sm">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Tarif PLN (Rp/kWh)</label>
                        <div class="flex items-center mt-3">
                            <i class="fa-solid fa-bolt text-gray-500 ml-1 mr-3 text-lg"></i>
                            <input type="number" id="tarifKwh" value="1444" class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-[#119468] text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-200 active:bg-green-800 transition">
                    Simpan & Tambah Rumah
                </button>
            </form>
        </main>
    </div>

    <script>
        document.getElementById("formRumah").addEventListener("submit", function(e) {
            e.preventDefault();
            let dataRumah = {
                nama: document.getElementById("namaRumah").value,
                alamat: document.getElementById("alamatRumah").value,
                jenis: document.getElementById("jenisRumah").value,
                luas: document.getElementById("luasRumah").value || "100",
                kamarTidur: document.getElementById("kamarTidur").value || "3",
                kamarMandi: document.getElementById("kamarMandi").value || "2",
                tarif: document.getElementById("tarifKwh").value || "1444"
            };
            localStorage.setItem("dataRumahPijar", JSON.stringify(dataRumah));
            window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
