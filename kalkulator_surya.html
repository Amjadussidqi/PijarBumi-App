<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Surya - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex justify-center">

    <div class="w-full max-w-md h-full relative flex flex-col bg-white overflow-hidden shadow-2xl">

        <header class="bg-gradient-to-br from-[#1cd988] to-[#119468] pt-12 pb-16 px-4 flex items-center rounded-b-[40px]">
            <a href="alat.html" class="text-gray-900 text-xl pl-2"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="flex-1 text-center text-lg font-bold text-gray-900 pr-6">Kalkulator Surya</h1>
        </header>

        <main class="flex-1 overflow-y-auto px-5 -mt-8 pb-10">

            <div class="bg-[#F59E0B] rounded-2xl p-5 flex items-center space-x-4 shadow-md mb-6">
                <i class="fa-solid fa-solar-panel text-white text-3xl opacity-80"></i>
                <div>
                    <h2 class="font-bold text-white text-lg leading-tight">Kalkulator ROI Surya</h2>
                    <p class="text-orange-100 text-xs mt-1">Lihat apakah tenaga surya tepat untuk Anda</p>
                </div>
            </div>

            <h3 class="text-sm font-bold text-gray-500 mb-4 px-1">Kalkulator Surya</h3>

            <form class="space-y-4">
                <div class="relative border border-gray-200 rounded-xl p-3 bg-gray-50/50">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Tagihan Listrik Bulanan ($)</label>
                    <div class="flex items-center mt-3">
                        <i class="fa-solid fa-dollar-sign text-gray-700 ml-1 mr-3 text-lg"></i>
                        <input type="number" value="150" class="w-full bg-transparent font-bold text-gray-800 text-lg focus:outline-none">
                    </div>
                </div>

                <div class="relative border border-gray-200 rounded-xl p-3 bg-gray-50/50">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Luas Atap (kaki persegi)</label>
                    <div class="flex items-center mt-3">
                        <i class="fa-solid fa-house text-gray-700 ml-1 mr-3 text-lg"></i>
                        <input type="number" value="1500" class="w-full bg-transparent font-bold text-gray-800 text-lg focus:outline-none">
                    </div>
                </div>

                <div class="relative border border-gray-200 rounded-xl p-3 bg-gray-50/50">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4">Rata-rata Jam Sinar Matahari/Hari</label>
                    <div class="flex items-center mt-3">
                        <i class="fa-solid fa-sun text-gray-700 ml-1 mr-3 text-lg"></i>
                        <input type="number" value="5" class="w-full bg-transparent font-bold text-gray-800 text-lg focus:outline-none">
                    </div>
                </div>

                <div class="relative border border-[#119468] rounded-xl p-3 bg-white">
                    <label class="text-[10px] font-bold text-[#119468] uppercase tracking-wider absolute top-2 left-4 bg-white px-1 -mt-3">Jenis Atap</label>
                    <select class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-2 appearance-none">
                        <option>Sirap Aspal</option>
                        <option>Genteng Tanah Liat</option>
                        <option>Seng / Metal</option>
                    </select>
                    <i class="fa-solid fa-caret-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>

                <div class="relative border border-gray-200 rounded-xl p-3 bg-gray-50/50">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider absolute top-2 left-4 bg-gray-50 px-1 -mt-3">Naungan</label>
                    <select class="w-full bg-transparent font-bold text-gray-800 text-base focus:outline-none mt-2 appearance-none">
                        <option>Tanpa Naungan</option>
                        <option>Sebagian Tertutup</option>
                    </select>
                    <i class="fa-solid fa-caret-down absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>

                <button type="button" class="w-full bg-[#119468] text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-green-200 active:bg-green-800 transition">
                    <i class="fa-solid fa-calculator mr-2"></i> Hitung ROI Surya
                </button>
            </form>
        </main>
    </div>
</body>
</html>
