<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-green-900 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <div class="mb-6 flex flex-col items-center justify-center">
            <i class="fa-solid fa-lightbulb text-amber-500 text-5xl mb-3"></i>
            <h1 class="text-3xl font-bold text-green-900">PijarBumi</h1>
            <p class="text-sm text-gray-500 mt-2">Platform Demokrasi & Efisiensi Energi</p>
        </div>
        
        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-gray-50 border focus:border-green-600 focus:outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-gray-50 border focus:border-green-600 focus:outline-none">
            
            <button onclick="prosesLogin()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex justify-center items-center">
                <span id="textTombol">Masuk Sekarang</span>
                <i id="loadingIcon" class="fa-solid fa-circle-notch fa-spin hidden ml-2"></i>
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
