<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style> ::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center overflow-hidden">

    <div class="w-full max-w-md h-full md:h-[90vh] md:rounded-[40px] md:shadow-2xl relative flex flex-col bg-gray-50 overflow-hidden border border-gray-200">
        
        <header class="bg-gradient-to-br from-[#1cd988] to-[#119468] pt-12 pb-8 px-6 text-white shadow-sm z-10 rounded-b-[30px] flex justify-between items-center">
            <div>
                <h1 id="sapaanUser" class="text-xl font-bold">Hai, Warga!</h1>
                <p class="text-xs text-green-100">Track your home energy and start saving</p>
            </div>
            <i class="fa-regular fa-bell text-xl cursor-pointer"></i>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-4 pb-24 space-y-6">
            
            <div id="areaInfoRumah"></div>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-bold text-gray-800">Ikhtisar Energi</h2>
                    <span class="text-xs text-gray-400 font-medium">this month</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] text-gray-400 font-bold mb-1">Total Penggunaan</p>
                        <h3 class="text-xl font-black text-gray-800">145 <span class="text-xs font-normal text-gray-400">kWh</span></h3>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <p class="text-[10px] text-gray-400 font-bold mb-1">Total Biaya</p>
                        <h3 class="text-xl font-black text-gray-800">Rp 209K</h3>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-sm font-bold text-gray-800 mb-3">Tindakan Cepat</h2>
                <div class="grid grid-cols-3 gap-3">
                    <a href="ruangan.html" class="flex flex-col items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center mb-1.5"><i class="fa-solid fa-door-open"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Ruangan</span>
                    </a>
                    <a href="tagihan.html" class="flex flex-col items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="w-10 h-10 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center mb-1.5"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Tagihan</span>
                    </a>
                    <a href="analitik.html" class="flex flex-col items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="w-10 h-10 bg-purple-50 text-purple-500 rounded-xl flex items-center justify-center mb-1.5"><i class="fa-solid fa-chart-pie"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Audit</span>
                    </a>
                </div>
            </div>
        </main>

        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around items-center pt-2 pb-5 px-2 z-20">
            <a href="dashboard.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <div class="bg-[#F59E0B] text-white px-5 py-1 rounded-full"><i class="fa-solid fa-table-cells-large text-lg"></i></div>
                <span class="text-[10px] font-bold">Dasbor</span>
            </a>
            <a href="analitik.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <i class="fa-solid fa-chart-simple text-xl"></i><span class="text-[10px] font-bold">Analitik</span>
            </a>
            <a href="alat.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <i class="fa-solid fa-wrench text-xl"></i><span class="text-[10px] font-bold">Alat</span>
            </a>
            <a href="pengaturan.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <i class="fa-solid fa-gear text-xl"></i><span class="text-[10px] font-bold">Pengaturan</span>
            </a>
        </nav>
    </div>

    <script src="js/app.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", function() {
            let dataSimpan = localStorage.getItem("dataRumahPijar");
            let area = document.getElementById("areaInfoRumah");
            if(dataSimpan) {
                let r = JSON.parse(dataSimpan);
                area.innerHTML = `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-emerald-100 text-[#119468] rounded-xl flex items-center justify-center text-lg">
                                <i class="fa-solid fa-house"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${r.nama}</h3>
                                <p class="text-[11px] text-gray-400 font-medium">${r.alamat} - ${r.luas} m²</p>
                            </div>
                        </div>
                        <a href="tambah_rumah.html" class="bg-emerald-50 text-[#119468] font-bold text-xs px-3 py-1.5 rounded-full hover:bg-emerald-100 transition">
                            Edit
                        </a>
                    </div>
                `;
            } else {
                area.innerHTML = `
                    <div class="bg-[#119468] text-white p-5 rounded-2xl shadow-md flex flex-col items-start space-y-2">
                        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-lg">
                            <i class="fa-solid fa-house"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-base">Selamat Datang di PijarBumi</h3>
                            <p class="text-[11px] text-green-100 mt-0.5">Tambahkan rumah pertama Anda untuk mulai melacak energi.</p>
                        </div>
                        <a href="tambah_rumah.html" class="bg-white text-[#119468] font-bold text-xs px-4 py-2.5 rounded-xl shadow hover:bg-green-50 transition mt-1">
                            Tambah Rumah
                        </a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
