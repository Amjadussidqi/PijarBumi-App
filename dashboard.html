<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex">

    <aside class="w-64 bg-green-900 text-white flex flex-col">
        <div class="p-6 flex items-center space-x-3">
            <i class="fa-solid fa-lightbulb text-amber-500 text-2xl"></i>
            <span class="text-2xl font-bold">PijarBumi</span>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="#" class="block px-4 py-3 bg-green-800 rounded-lg"><i class="fa-solid fa-chart-pie mr-2"></i> Dashboard</a>
        </nav>
        <div class="p-4">
            <button onclick="prosesLogout()" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white font-bold">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar
            </button>
        </div>
    </aside>

    <main class="flex-1 p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Ringkasan Emisi RT 04</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-amber-500">
                <p class="text-gray-500 font-bold mb-1">Konsumsi Listrik (KWh)</p>
                <h3 class="text-4xl font-black text-gray-800">145</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-600">
                <p class="text-gray-500 font-bold mb-1">Jejak Karbon (CO2)</p>
                <h3 class="text-4xl font-black text-gray-800">126 <span class="text-lg text-gray-500">kg</span></h3>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
