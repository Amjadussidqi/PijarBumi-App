<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jejak Karbon - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex justify-center">

    <div class="w-full max-w-md h-full relative flex flex-col bg-gray-50 overflow-hidden shadow-2xl">
        
        <header class="bg-gradient-to-br from-[#1cd988] to-[#119468] pt-12 pb-20 px-4 flex items-center rounded-b-[40px]">
            <a href="alat.html" class="text-gray-900 text-xl pl-2"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="flex-1 text-center text-lg font-bold text-gray-900 pr-6">Jejak Karbon</h1>
        </header>

        <main class="flex-1 overflow-y-auto px-5 -mt-12 pb-10">

            <div class="bg-gradient-to-br from-[#1dc982] to-[#119468] rounded-2xl p-6 text-center shadow-lg mb-8">
                <i class="fa-solid fa-leaf text-white text-3xl mb-2 opacity-90"></i>
                <h2 class="text-5xl font-black text-white tracking-tight mb-1">126 kg</h2>
                <p class="text-green-100 font-medium text-sm mb-4">Total Emisi CO2</p>
                <p class="text-green-50 text-xs opacity-80 px-4">Itu setara dengan 5 pohon yang dibutuhkan per tahun untuk menyerapnya.</p>
            </div>

            <h3 class="text-lg font-bold text-gray-800 mb-4 px-1">Rincian</h3>

            <div class="grid grid-cols-2 gap-4">
       
                <div class="bg-orange-50/50 border border-orange-100 p-4 rounded-2xl flex flex-col items-start shadow-sm">
                    <div class="w-8 h-8 bg-orange-400 rounded-full flex items-center justify-center text-white text-sm mb-4 shadow-md">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <h4 class="text-xl font-bold text-gray-800">126 kg</h4>
                    <p class="text-xs text-gray-500 font-medium mt-1">Listrik</p>
                </div>

                <div class="bg-red-50/50 border border-red-100 p-4 rounded-2xl flex flex-col items-start shadow-sm">
                    <div class="w-8 h-8 bg-red-400 rounded-full flex items-center justify-center text-white text-sm mb-4 shadow-md">
                        <i class="fa-solid fa-fire"></i>
                    </div>
                    <h4 class="text-xl font-bold text-gray-800">0 kg</h4>
                    <p class="text-xs text-gray-500 font-medium mt-1">Gas Alam</p>
                </div>

                <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-2xl flex flex-col items-start shadow-sm">
                    <div class="w-8 h-8 bg-blue-400 rounded-full flex items-center justify-center text-white text-sm mb-4 shadow-md">
                        <i class="fa-solid fa-car"></i>
                    </div>
                    <h4 class="text-xl font-bold text-gray-800">0 kg</h4>
                    <p class="text-xs text-gray-500 font-medium mt-1">Transportasi</p>
                </div>

            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
