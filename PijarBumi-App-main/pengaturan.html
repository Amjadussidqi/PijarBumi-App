<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style> ::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex">

    <aside class="hidden md:flex w-64 bg-green-900 text-white flex-col shadow-xl z-20">
        <div class="p-6 flex items-center space-x-3">
            <i class="fa-solid fa-lightbulb text-amber-500 text-2xl"></i>
            <span class="text-2xl font-bold">PijarBumi</span>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-green-800 rounded-lg transition"><i class="fa-solid fa-table-cells-large mr-2"></i> Dasbor</a>
            <a href="pengaturan.html" class="block px-4 py-3 bg-green-800 rounded-lg font-bold"><i class="fa-solid fa-gear mr-2"></i> Pengaturan</a>
        </nav>
        <div class="p-4">
            <button onclick="prosesLogout()" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white font-bold">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative w-full bg-white md:bg-gray-50">
        
        <header class="pt-10 md:pt-12 pb-4 text-center bg-white shadow-sm md:shadow-none z-10">
            <h1 class="text-lg md:text-2xl font-bold text-gray-800">Pengaturan</h1>
        </header>
        <div class="flex-1 overflow-y-auto px-5 md:px-8 pb-28 md:pb-8">
            <div class="max-w-2xl mx-auto mt-4">
                
                <div class="border border-gray-200 bg-white rounded-2xl p-4 flex items-center justify-between mb-5 shadow-sm">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 bg-[#119468] rounded-full flex items-center justify-center text-white text-xl font-bold">M</div>
                        <div>
                            <h2 class="text-base md:text-lg font-bold text-gray-900">Miaw Meo</h2>
                            <p class="text-xs md:text-sm text-gray-400">budi.santoso@warga.com</p>
                        </div>
                    </div>
                    <div class="text-[#119468]"><i class="fa-solid fa-pen cursor-pointer hover:text-green-800"></i></div>
                </div>

                <div class="bg-[#119468] rounded-xl p-4 flex items-center justify-between text-white mb-6 shadow-md hover:bg-green-800 transition cursor-pointer">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center"><i class="fa-solid fa-award text-xl"></i></div>
                        <div>
                            <h3 class="font-bold text-sm md:text-base">Dukung Gerakan Hijau</h3>
                            <p class="text-[10px] md:text-xs text-green-100">Jadilah donatur untuk kampanye iklim RT...</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="bg-white text-xs text-[#119468] font-bold py-1.5 px-3 rounded-full">INFO</button>
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </div>
                </div>

                <div class="space-y-1 bg-white md:p-6 md:rounded-2xl md:shadow-sm">
                    <a href="#" class="flex items-center justify-between py-3.5 hover:bg-gray-50 rounded-lg transition px-2">
                        <div class="flex items-center space-x-4">
                            <i class="fa-solid fa-house text-gray-500 w-6 text-center text-lg"></i><span class="font-semibold text-[15px] text-gray-700">Rumah Saya</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between py-3.5 hover:bg-gray-50 rounded-lg transition px-2">
                        <div class="flex items-center space-x-4">
                            <i class="fa-solid fa-lock text-gray-500 w-6 text-center text-lg"></i><span class="font-semibold text-[15px] text-gray-700">Ubah Kata Sandi</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between py-3.5 hover:bg-gray-50 rounded-lg transition px-2">
                        <div class="flex items-center space-x-4">
                            <i class="fa-solid fa-bell text-gray-500 w-6 text-center text-lg"></i><span class="font-semibold text-[15px] text-gray-700">Preferensi Notifikasi</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-400 text-sm"></i>
                    </a>
                    
                    <div class="h-4 border-b border-gray-100 mb-4"></div>

                    <a href="#" onclick="prosesLogout()" class="md:hidden flex items-center justify-between py-3.5 hover:bg-red-50 rounded-lg transition px-2 mt-4">
                        <div class="flex items-center space-x-4">
                            <i class="fa-solid fa-arrow-right-from-bracket text-red-500 w-6 text-center text-lg"></i><span class="font-semibold text-[15px] text-red-500">Keluar</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-gray-300 text-sm"></i>
                    </a>
                </div>
            </div>
        </div>

        <nav class="md:hidden absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around items-center pt-2 pb-6 px-2 shadow-[0_-4px_10px_rgba(0,0,0,0.02)] z-20">
            <a href="dashboard.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <i class="fa-solid fa-table-cells-large text-xl"></i><span class="text-[10px] font-bold">Dasbor</span>
            </a>
            <a href="#" class="flex flex-col items-center space-y-1 text-gray-800">
                <i class="fa-solid fa-chart-simple text-xl"></i><span class="text-[10px] font-bold">Analitik</span>
            </a>
            <a href="pengaturan.html" class="flex flex-col items-center space-y-1 text-gray-800">
                <div class="bg-[#F59E0B] text-white px-5 py-1 rounded-full"><i class="fa-solid fa-gear text-lg"></i></div>
                <span class="text-[10px] font-bold">Pengaturan</span>
            </a>
        </nav>

    <script src="js/app.js"></script>

</html>
