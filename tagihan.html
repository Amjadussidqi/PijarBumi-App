<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagihan Utilitas - PijarBumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style> ::-webkit-scrollbar { display: none; } </style>
</head>
<body class="bg-gray-100 h-screen flex justify-center">

    <div class="w-full max-w-md h-full relative flex flex-col bg-gray-50 overflow-hidden shadow-2xl">
        
        <header class="bg-gradient-to-br from-[#1cd988] to-[#119468] pt-12 pb-12 px-4 flex items-center rounded-b-[40px] text-white">
            <a href="dashboard.html" class="text-white text-xl pl-2"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="flex-1 text-center text-lg font-bold pr-6">Tagihan Utilitas PLN</h1>
        </header>

        <main class="flex-1 overflow-y-auto px-5 -mt-6 pb-12 space-y-4">
            
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400">BULAN INI</span>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">Lunas</span>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-black text-xl text-gray-800">Rp 209.481</h3>
                        <p class="text-xs text-gray-400 mt-0.5">145 kWh · Token / Pascabayar</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-100 text-amber-500 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-400">BULAN LALU</span>
                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">Lunas</span>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-black text-xl text-gray-800">Rp 230.000</h3>
                        <p class="text-xs text-gray-400 mt-0.5">160 kWh · Token / Pascabayar</p>
                    </div>
                    <div class="w-12 h-12 bg-gray-100 text-gray-500 rounded-2xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                </div>
            </div>

            <button onclick="alert('Fitur unggah foto struk tagihan berhasil disimulasikan!')" class="w-full bg-[#119468] text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-200 active:bg-green-800 transition mt-4">
                <i class="fa-solid fa-upload mr-2"></i> Unggah / Catat Tagihan Baru
            </button>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
